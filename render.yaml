databases:
  - name: neon-wallet-db
    databaseName: neon_wallet
    user: neon_wallet
    plan: free
    region: frankfurt
    postgresMajorVersion: 18

services:
  - type: web
    name: neon-wallet-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neon-wallet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REGISTRATION_BONUS_KOPECKS
        value: "500000"
      - key: TOKEN_TTL_HOURS
        value: "168"
